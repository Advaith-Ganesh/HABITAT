name: HABITAT verification
on:
  push:
    branches: [main, habitat-v7-remediation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLCONFIGDIR: /tmp/habitat-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clear prior checked-in browser outputs in this ephemeral checkout
        run: rm -f reports/v7-e2e.json docs/screenshots/v7-runner-*.png
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-lock.txt
          npm --prefix frontend ci
      - name: Frontend checks and production build
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
      - name: Backend suite (built entrypoint required for security-header checks)
        run: .venv/bin/python -m pytest -q
      - name: Reproduce document assurance benchmark without changing original ML artifacts
        run: .venv/bin/python -m scripts.benchmark_evidence
      - name: Install supported Playwright Chromium and Linux dependencies
        run: npm --prefix frontend run browser:install -- --with-deps
      - name: Full browser suite and viewport/accessibility matrix
        run: npm --prefix frontend run test:e2e
      - name: Save genuine browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habitat-v7-browser-evidence
          path: |
            reports/v7-e2e.json
            reports/document_assurance.json
            docs/screenshots/responsible-*.png
            docs/screenshots/v7-runner-*.png
            frontend/test-results/
